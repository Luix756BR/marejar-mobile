<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marejar - Ondas de destinos</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .splash-screen {
      background: linear-gradient(180deg, #0c4352 0%, #165e70 100%);
      color: #ffffff;
      justify-content: space-between;
      align-items: center;
      padding: 60px 24px 50px;
      text-align: center;
    }
    .brand-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.4rem;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .brand-subtitle {
      font-family: 'trebuchet ms', sans-serif;
      font-size: 0.95rem;
      opacity: 0.9;
      max-width: 240px;
      margin: 0 auto;
    }
    .compass-graphic {
      width: 220px;
      height: 220px;
      opacity: 0.25;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <main class="app-container splash-screen">
    <header>
      <h1 class="brand-title">MAREJAR</h1>
      <p class="brand-subtitle">Ondas de destinos, marés de experiências</p>
    </header>

    <!-- Espaço para o SVG/Imagem da Bússola do protótipo -->
    <div class="compass-graphic">
      <img src="assets/img/Logo-branca.png" alt="Logo" style="width: 100%; height: 100%;">
    </div>

    <footer>
      <a href="pages/login.html" class="btn-outline-light">Entrar</a>
    </footer>
  </main>
</body>
</html>
