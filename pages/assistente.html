<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIA IA - Marejar</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    :root {
      --primary-dark: #0c4352;
      --primary-mid: #165e70;
      --text-dark: #102a32;
      --text-muted: #5c737a;
      --border-radius-pill: 999px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #eef4f6;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      color: var(--text-dark);
    }

    .app-container {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f8fbfc;
      display: flex;
      flex-direction: column;
      padding-bottom: 148px;
      box-shadow: 0 12px 32px rgba(12, 67, 82, 0.12);
    }

    .ai-header {
      background: linear-gradient(160deg, var(--primary-dark) 0%, var(--primary-mid) 100%);
      color: #fff;
      padding: 18px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .ai-header h1 { margin: 0 0 3px; font-size: 1.2rem; }
    .ai-header p { margin: 0; font-size: 0.76rem; opacity: 0.88; }

    .chat-area {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .welcome-card {
      background: #fff;
      border: 1px solid #e2eef2;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--primary-dark);
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 84%;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .msg-ai {
      align-self: flex-start;
      background: #fff;
      color: var(--text-dark);
      border-left: 4px solid var(--primary-mid);
      border-top: 1px solid #e3eef2;
      border-right: 1px solid #e3eef2;
      border-bottom: 1px solid #e3eef2;
      padding: 12px 14px;
      border-radius: 4px 16px 16px 16px;
      max-width: 90%;
      font-size: 0.82rem;
      line-height: 1.48;
      box-shadow: 0 2px 8px rgba(12, 67, 82, 0.05);
    }

    .composer-dock {
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(248, 251, 252, 0.96);
      backdrop-filter: blur(8px);
      padding: 8px 12px 10px;
      border-top: 1px solid #e1ecf0;
      z-index: 25;
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      background: #fff;
      border: 1px solid #c9dce2;
      color: var(--primary-dark);
      border-radius: var(--border-radius-pill);
      padding: 5px 11px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-form {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid #d5e4e9;
      border-radius: var(--border-radius-pill);
      padding: 5px 6px 5px 14px;
      box-shadow: 0 4px 14px rgba(12, 67, 82, 0.08);
    }

    .input-form input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text-dark);
    }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--primary-dark);
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-top: 1px solid #dce8ec;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px 10px;
      z-index: 30;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: #6b828a;
      font-size: 0.66rem;
      font-weight: 600;
    }

    .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item.active { color: var(--primary-dark); }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="ai-header">
      <h1>MIA • Assistente Marejar</h1>
      <p>Roteiros e dicas no litoral norte de Pernambuco</p>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome-card">
        <strong style="color:var(--primary-dark);display:block;margin-bottom:4px;">Olá! Como posso ajudar no seu roteiro?</strong>
        <span style="font-size:0.78rem;color:var(--text-muted);">Peça roteiros por Olinda, Paulista, Igarassu, Itapissuma, Itamaracá ou Goiana.</span>
      </div>
    </section>

    <div class="composer-dock">
      <div class="chips-row">
        <button type="button" class="chip" onclick="sendPreset('Monte um roteiro de 1 dia em Itamaracá e Itapissuma.')">Itamaracá + Itapissuma</button>
        <button type="button" class="chip" onclick="sendPreset('Quais os pontos históricos de Olinda e Igarassu?')">História Olinda/Igarassu</button>
        <button type="button" class="chip" onclick="sendPreset('Sugira um roteiro econômico em Paulista e Goiana.')">Econômico Paulista/Goiana</button>
      </div>
      <form class="input-form" id="aiForm">
        <input type="text" id="aiInput" placeholder="Digite seu destino ou dúvida..." autocomplete="off" required>
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Início
      </a>
      <a href="roteiros.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Roteiros
      </a>
      <a href="assistente.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
        IA
      </a>
      <a href="guias.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Caça-maré
      </a>
      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        Perfil
      </a>
    </nav>
  </main>

  <script>
    const chatArea = document.getElementById('chatArea');
    const aiForm = document.getElementById('aiForm');
    const aiInput = document.getElementById('aiInput');

    aiForm.addEventListener('submit', e => {
      e.preventDefault();
      const texto = aiInput.value.trim();
      if (!texto) return;
      aiInput.value = '';
      enviarMensagem(texto);
    });

    function sendPreset(texto) {
      enviarMensagem(texto);
    }

    function appendBubble(html, tipo) {
      const div = document.createElement('div');
      div.className = tipo === 'user' ? 'msg-user' : 'msg-ai';
      div.innerHTML = html;
      chatArea.appendChild(div);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return div;
    }

    async function enviarMensagem(promptText) {
      appendBubble(escapeHtml(promptText), 'user');
      const loadingBubble = appendBubble('<em>MIA está montando seu roteiro...</em>', 'ai');

      try {
        const res = await fetch('http://localhost:3001/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await res.json();
        loadingBubble.remove();

        if (res.ok && data.reply) {
          appendBubble(escapeHtml(data.reply).replace(/\n/g, '<br>'), 'ai');
        } else {
          appendBubble(respostaLocalFallback(promptText), 'ai');
        }
      } catch (_) {
        loadingBubble.remove();
        appendBubble(respostaLocalFallback(promptText), 'ai');
      }
    }

    function respostaLocalFallback(pergunta) {
      return `<strong>Roteiro sugerido para: "${escapeHtml(pergunta)}"</strong><br><br>
      • <strong>Manhã:</strong> Explore praias, mirantes ou centros históricos de Olinda, Igarassu ou Ilha de Itamaracá.<br>
      • <strong>Almoço:</strong> Experimente frutos do mar ou pratos regionais em estabelecimentos parceiros.<br>
      • <strong>Tarde:</strong> Registre sua visita nas missões do <strong>Caça-maré</strong> para somar XP e resgatar benefícios.`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[c]));
    }
  </script>
</body>
</html>
