<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Marejar</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .auth-header {
      padding: 24px 24px 16px;
      text-align: center;
      background-color: var(--bg-light);
    }
    .auth-header h1 {
      font-family: Georgia, serif;
      color: var(--primary-dark);
      letter-spacing: 2px;
      font-size: 1.5rem;
    }
    .auth-card {
      flex: 1;
      background-color: var(--primary-dark);
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 24px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .auth-card h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--border-radius-pill);
      border: none;
      background-color: var(--input-bg);
      color: var(--text-dark);
      font-size: 0.9rem;
      outline: none;
    }
    .submit-wrapper {
      text-align: center;
      margin-top: 16px;
    }
    /* Estilo do botão com suporte a disabled */
    .btn-custom {
      background: transparent;
      border: 2px solid var(--surface-white);
      color: var(--surface-white);
      padding: 12px 36px;
      border-radius: var(--border-radius-pill);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: 0.2s;
    }
    .btn-custom:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.3);
    }
    .btn-custom:not(:disabled):hover {
      background: var(--surface-white);
      color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="auth-header">
      <p style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Cadastro</p>
      <h1>MAREJAR</h1>
    </header>

    <section class="auth-card">
      <h2>Criar Conta</h2>
      
      <form id="cadastroForm">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Olivia Wilson" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="nascimento">Data de Nascimento</label>
          <input type="text" id="nascimento" placeholder="DD/MM/AAAA" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="hello@reallygreatsite.com" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone (celular)</label>
          <input type="text" id="telefone" placeholder="(00) 00000-0000" autocomplete="off" required>
        </div>

        <div class="submit-wrapper">
          <!-- Botão começa desativado -->
          <button type="submit" id="btnProximoCadastro" class="btn-custom" disabled>Próximo</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const inputs = document.querySelectorAll('#cadastroForm input');
    const btnProximoCadastro = document.getElementById('btnProximoCadastro');
    const cadastroForm = document.getElementById('cadastroForm');

    // Função que verifica se TODOS os campos estão preenchidos
    function validarFormularioCadastro() {
      let todosPreenchidos = true;

      inputs.forEach(input => {
        if (input.value.trim() === "") {
          todosPreenchidos = false;
        }
      });

      if (todosPreenchidos) {
        btnProximoCadastro.removeAttribute('disabled');
      } else {
        btnProximoCadastro.setAttribute('disabled', 'true');
      }
    }

    // Adiciona o listener de input para cada campo do formulário
    inputs.forEach(input => {
      input.addEventListener('input', validarFormularioCadastro);
    });

    // Evento ao submeter o formulário (avança para a verificação)
    cadastroForm.addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'home.html'; // Redireciona para a tela principal após o cadastro
    });
  </script>
</body>
</html>
