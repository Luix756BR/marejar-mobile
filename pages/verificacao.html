<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação - Marejar</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .verify-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .verify-box {
      background-color: var(--primary-dark);
      border-radius: 24px;
      padding: 32px 24px;
      color: #ffffff;
    }
    .code-inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }
    .code-inputs input {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background-color: var(--input-bg);
      font-size: 1.5rem;
      text-align: center;
      font-weight: bold;
      color: var(--text-dark);
      outline: none;
    }
  </style>
</head>
<body>
  <main class="app-container">
    <div class="verify-content">
      <div class="verify-box">
        <p style="font-size: 0.8rem; opacity: 0.8; margin-bottom: 8px;">Verifique seu e-mail</p>
        <h1 style="font-family: Georgia, serif; font-size: 1.5rem; margin-bottom: 24px;">MAREJAR</h1>
        
        <h2 style="font-size: 1.1rem; margin-bottom: 8px;">Verificação em duas etapas</h2>
        <p style="font-size: 0.85rem; opacity: 0.9; margin-bottom: 24px;">Insira o código de 4 dígitos enviado por e-mail.</p>

        <div class="code-inputs">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
        </div>

        <a href="home.html" class="btn-outline-light" style="display: block; margin-top: 16px;">Verificar</a>
      </div>
    </div>
  </main>
</body>
</html>
